<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wrong QR</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #050816, #0b1230, #07101f);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    .box {
      width: 100%;
      max-width: 850px;
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid rgba(0, 245, 212, 0.25);
      border-radius: 24px;
      padding: 40px 25px;
      box-shadow: 0 0 35px rgba(0, 245, 212, 0.08);
    }

    .character {
      font-size: 100px;
      margin-bottom: 20px;
    }

    .title {
      font-size: 60px;
      font-weight: 900;
      color: #fff0f0;
      text-shadow:
        0 0 10px #ff2d55,
        0 0 20px #ff2d55,
        0 0 35px #ff2d55;
      margin-bottom: 15px;
    }

    .subtitle {
      font-size: 40px;
      font-weight: 800;
      color: #ffd54f;
      margin-bottom: 25px;
    }

    .message {
      background: rgba(8, 23, 48, 0.95);
      border: 2px solid #00e5c3;
      border-radius: 18px;
      padding: 25px 20px;
      font-size: 28px;
      line-height: 1.6;
      color: #f2f2f2;
    }

    .highlight {
      color: #17f1bf;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      .title {
        font-size: 42px;
      }

      .subtitle {
        font-size: 28px;
      }

      .message {
        font-size: 22px;
      }

      .character {
        font-size: 75px;
      }
    }
  </style>
</head>
<body>

  <div class="box">
    <div class="character">🦝🔎</div>

    <div class="title">Oops!</div>
    <div class="subtitle">Wrong QR!</div>

    <div class="message">
      Uh-oh! This QR is not the correct one 😵‍💫<br><br>
      <span class="highlight">The real QR is hiding somewhere nearby.</span><br><br>
      Open your eyes, use your brain, and hunt carefully! 🕵️‍♂️🔍
    </div>
  </div>

</body>
</html>
